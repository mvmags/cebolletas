<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cebolletas Copal: descanso entre árboles, senderos y cielo abierto en Calvillo, Aguascalientes.">
  <meta name="theme-color" content="#f4eed7">
  <title>Cebolletas Copal</title>
  <link rel="icon" href="assets/logo-copal.png">
  <link rel="preload" href="assets/copal-hero.webp" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="microsite">
    <header class="site-header">
      <button class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
      <div class="header-tools">
        <span class="external-mark" aria-hidden="true">↗</span>
        <div class="language" aria-label="Seleccionar idioma">
          <button type="button" class="active" data-lang="es">Español</button>
          <span>/</span>
          <button type="button" data-lang="en">English</button>
        </div>
        <img class="mobile-logo" src="assets/logo-copal.png" alt="Cebolletas Copal">
      </div>
      <nav id="main-nav" aria-label="Navegación principal">
        <span data-copy="navPlace" title="Próximamente">El lugar</span>
        <span data-copy="navGallery" title="Próximamente">Galería</span>
        <span data-copy="navBooking" title="Próximamente">Reserva</span>
      </nav>
    </header>
    <div class="page-grid">
      <aside class="identity">
        <img src="assets/logo-copal.png" alt="Cebolletas Copal">
        <p data-copy="parent">Es parte del desarrollo particular Cebolletas.</p>
      </aside>
      <section class="hero" aria-labelledby="hero-title">
        <img src="assets/copal-hero.webp" alt="Cebolletas Copal y el entorno natural que lo rodea">
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-copy">
          <p data-copy="eyebrow">Glamping en Calvillo · Aguascalientes, México</p>
          <h1 id="hero-title" data-copy="title">Descansa entre<br>árboles,<br>senderos y cielo<br>abierto.</h1>
        </div>
      </section>
    </div>
    <footer>
      <p>© 2026 Cebolletas Copal</p>
      <div class="social" aria-label="Redes sociales">
        <span aria-label="Instagram">◎</span>
        <span aria-label="Facebook">f</span>
      </div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
