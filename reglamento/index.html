<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reglamento general y reglas para acampar en Cebolletas, Calvillo, Aguascalientes.">
  <title>Reglamento | Cebolletas</title>
  <link rel="stylesheet" href="../assets/css/fontawesome-all.min.css">
  <link rel="stylesheet" href="./reglamento.css?v=10.2.0">
</head>
<body>
  <header class="rules-header">
    <a class="brand" href="../" aria-label="Cebolletas, inicio">
      <img src="../images/Logo_v6_290x65.png" alt="Cebolletas">
    </a>
    <nav aria-label="Navegación del reglamento">
      <a href="#reglas-generales" data-label="general">Reglas generales</a>
      <a href="#camping" data-label="camping">Camping</a>
      <a href="#incumplimiento" data-label="violations">Incumplimiento</a>
    </nav>
    <div class="language" aria-label="Idioma">
      <button type="button" data-lang="es" class="active">ES</button><span>/</span>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="rules-hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="page-title"></h1>
        <p class="hero-lead" id="hero-lead"></p>
        <a class="hero-link" href="#reglas-generales" id="hero-action"></a>
      </div>
    </section>

    <section class="rules-section" id="reglas-generales" aria-labelledby="general-title">
      <div class="section-intro">
        <p class="eyebrow" id="general-eyebrow"></p>
        <h2 id="general-title"></h2>
        <p id="general-lead"></p>
      </div>
      <div class="rules-grid" id="general-rules"></div>
    </section>

    <section class="rules-section camping-section" id="camping" aria-labelledby="camping-title">
      <div class="section-intro">
        <p class="eyebrow" id="camping-eyebrow"></p>
        <h2 id="camping-title"></h2>
        <p id="camping-lead"></p>
      </div>
      <div class="rules-grid" id="camping-rules"></div>
    </section>

    <section class="closing-section" id="incumplimiento" aria-labelledby="violations-title">
      <article class="closing-card violation-card">
        <span class="closing-icon fas fa-balance-scale" aria-hidden="true"></span>
        <div><p class="eyebrow" id="violations-eyebrow"></p><h2 id="violations-title"></h2><p id="violations-copy"></p></div>
      </article>
      <article class="closing-card risk-card">
        <span class="closing-icon fas fa-exclamation-triangle" aria-hidden="true"></span>
        <div><p class="eyebrow" id="risk-eyebrow"></p><h2 id="risk-title"></h2><p id="risk-copy"></p></div>
      </article>
    </section>
  </main>

  <footer>
    <a href="../" id="back-link"></a>
    <p>© 2026 Cebolletas · Calvillo, Aguascalientes</p>
  </footer>
  <script src="./reglamento.js?v=10.2.0"></script>
</body>
</html>
